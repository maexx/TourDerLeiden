    const routeList = document.getElementById('route-list');
    const routeSummary = document.getElementById('route-summary');
    const totalDistanceKm = routeSections.reduce((total, section) => total + section.distanceKm, 0);
    const totalAscentMeters = routeSections.reduce((total, section) => total + section.ascentMeters, 0);
    const formatDistance = (distance) => `${distance.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} km`;
    const formatAscent = (ascent) => `${ascent.toLocaleString('de-DE')} hm`;
    routeSummary.textContent = `Gesamt: ${formatDistance(totalDistanceKm)} · ${formatAscent(totalAscentMeters)}`;
    routeList.innerHTML = routeSections
      .map((section) => {
        const downloads = section.downloads.length
          ? `<div class="route-downloads">${section.downloads
              .map(
                (route) =>
                  `<a href="${route.file}" download>GPX herunterladen (${route.label} · ${formatDistance(route.distanceKm)}${Number.isFinite(route.ascentMeters) ? ` · ${formatAscent(route.ascentMeters)}` : ''})</a>`
              )
              .join('')}</div>`
          : '<span class="route-note">noch keine GPX-Datei vorhanden</span>';

        return `
          <article class="route-item">
            <div class="route-heading">
              <strong>${section.title}:</strong>
              <span class="route-stage-stats">${formatDistance(section.distanceKm)} · ${formatAscent(section.ascentMeters)}</span>
              ${downloads}
            </div>
            <details class="route-photos-details">
              <summary class="route-photos-label">Fotos dieser Etappe anzeigen</summary>
              <div class="route-photos" data-route="${section.photoKey}"></div>
            </details>
          </article>
        `;
      })
      .join('');

    const routeMap = document.getElementById('routemap');
    const gpxFiles = routeSections.flatMap((section) => section.downloads.map((route) => route.file));
    const colors = ['#6a1b3d', '#d4af37', '#2f9e44', '#1971c2', '#ae3ec9', '#f08c00', '#0c8599', '#495057'];
    const rawRouteCoordinates = window.gpxRouteCoordinates || window.routeCoordinates || {};

    function normalizeRouteKey(value) {
      return String(value || '')
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '');
    }

    function findRouteCoordinates(file) {
      if (!file) return [];

      const direct = rawRouteCoordinates[file];
      if (Array.isArray(direct) && direct.length) return direct;

      const targetKey = normalizeRouteKey(file);
      for (const [key, coordinates] of Object.entries(rawRouteCoordinates)) {
        if (normalizeRouteKey(key) === targetKey && Array.isArray(coordinates) && coordinates.length) {
          return coordinates;
        }
      }

      return [];
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function getAvailableRoutes() {
      return gpxFiles
        .map((file, index) => {
          const coordinates = findRouteCoordinates(file);
          if (!coordinates || !coordinates.length) return null;
          const sectionIndex = routeSections.findIndex((section) =>
            section.downloads.some((route) => route.file === file)
          );
          const route = sectionIndex >= 0
            ? routeSections[sectionIndex].downloads.find((download) => download.file === file)
            : null;
          return {
            file,
            label: route && route.mapLabel ? route.mapLabel : sectionIndex >= 0 ? `Tag ${sectionIndex}` : 'GPX-Track',
            color: colors[(sectionIndex >= 0 ? sectionIndex : index) % colors.length],
            coordinates
          };
        })
        .filter(Boolean);
    }

    function renderRouteFallback(availableRoutes) {
      if (!routeMap) return;

      if (!availableRoutes.length) {
        routeMap.innerHTML = '<p class="route-map-empty">Keine GPX-Daten gefunden.</p>';
        return;
      }

      let minLat = Number.POSITIVE_INFINITY;
      let maxLat = Number.NEGATIVE_INFINITY;
      let minLng = Number.POSITIVE_INFINITY;
      let maxLng = Number.NEGATIVE_INFINITY;

      availableRoutes.forEach((route) => {
        route.coordinates.forEach((coord) => {
          const lat = coord[0];
          const lng = coord[1];
          if (lat < minLat) minLat = lat;
          if (lat > maxLat) maxLat = lat;
          if (lng < minLng) minLng = lng;
          if (lng > maxLng) maxLng = lng;
        });
      });

      if (!Number.isFinite(minLat) || !Number.isFinite(minLng)) {
        routeMap.innerHTML = '<p class="route-map-empty">Keine GPX-Daten gefunden.</p>';
        return;
      }

      const latRange = Math.max(maxLat - minLat, 0.0001);
      const lngRange = Math.max(maxLng - minLng, 0.0001);
      const width = 1000;
      const height = 520;
      const padding = 26;
      const maxPointsPerRoute = 2200;

      const sampleCoordinates = (coordinates) => {
        if (!Array.isArray(coordinates) || coordinates.length <= maxPointsPerRoute) {
          return coordinates;
        }

        const step = Math.ceil(coordinates.length / maxPointsPerRoute);
        const sampled = [];
        for (let i = 0; i < coordinates.length; i += step) {
          sampled.push(coordinates[i]);
        }

        const last = coordinates[coordinates.length - 1];
        if (sampled[sampled.length - 1] !== last) {
          sampled.push(last);
        }

        return sampled;
      };

      const toXY = (coord) => {
        const x = padding + ((coord[1] - minLng) / lngRange) * (width - padding * 2);
        const y = height - padding - ((coord[0] - minLat) / latRange) * (height - padding * 2);
        return `${x.toFixed(2)},${y.toFixed(2)}`;
      };

      const paths = availableRoutes
        .map(
          (route) =>
            `<polyline points="${sampleCoordinates(route.coordinates).map(toXY).join(' ')}" stroke="${route.color}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>${escapeHtml(route.label)}</title></polyline>`
        )
        .join('');

      const legend = Array.from(new Map(availableRoutes.map((route) => [route.label, route])).values())
        .map(
          (route) =>
            `<li><span style="background:${route.color}"></span>${escapeHtml(route.label)}</li>`
        )
        .join('');

      routeMap.innerHTML = `
        <div class="route-map-fallback" role="img" aria-label="Schematische Streckenansicht">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
            <rect x="0" y="0" width="${width}" height="${height}" rx="10" ry="10" fill="#f2f6f8"></rect>
            ${paths}
          </svg>
          <ul class="route-map-legend">${legend}</ul>
        </div>
      `;
    }

    function renderRouteMap() {
      if (!routeMap) return;

      const availableRoutes = getAvailableRoutes();

      if (!availableRoutes.length) {
        routeMap.innerHTML = '<p class="route-map-empty">Keine GPX-Daten gefunden.</p>';
        return;
      }

      if (typeof L === 'undefined') {
        renderRouteFallback(availableRoutes);
        return;
      }

      try {
        routeMap.innerHTML = '';
        const map = L.map('routemap', { scrollWheelZoom: true });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxZoom: 18
        }).addTo(map);

        const allLatLngs = [];
        availableRoutes.forEach((route) => {
          const latLngs = route.coordinates.map((c) => [c[0], c[1]]);
          allLatLngs.push(...latLngs);
          L.polyline(latLngs, {
            color: route.color,
            weight: 4,
            opacity: 0.85,
            lineJoin: 'round'
          }).bindTooltip(route.label, { sticky: true }).addTo(map);
        });

        if (allLatLngs.length) {
          map.fitBounds(L.latLngBounds(allLatLngs), { padding: [28, 28] });
        }
      } catch (error) {
        console.error('Route map rendering failed:', error);
        renderRouteFallback(availableRoutes);
      }
    }

    function initializeRouteMap() {
      renderRouteMap();

      if (typeof L === 'undefined') {
        const leafletScript = document.querySelector('script[src*="leaflet.js"]');
        if (leafletScript) {
          leafletScript.addEventListener('load', renderRouteMap, { once: true });
        }
      }
    }

    initializeRouteMap();
  </script>
