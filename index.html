<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maexx69.de</title>
  <script>
    const legacyPages = {
      '#ueberblick': 'news.html',
      '#news': 'news.html',
      '#historie': 'historie.html',
      '#strecke': '2026.html',
      '#jahr-2027': '2027.html',
      '#links': 'links.html'
    };
    const legacyPage = legacyPages[location.hash];
    if (legacyPage) location.replace(legacyPage + location.search + location.hash);
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f5f2;
      color: #2a2a2a;
      font: 1rem/1.5 "Segoe UI", Arial, sans-serif;
    }
    header {
      padding: 2rem 1.5rem;
      background: #6a1b3d;
      color: #fff;
    }
    header div, main { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0; font-size: 2rem; }
    header p { margin: 0.3rem 0 0; }
    main { padding: 2rem 1.5rem; }
    h2 { color: #6a1b3d; }
    .areas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 1rem;
    }
    .area {
      display: block;
      overflow: hidden;
      border: 1px solid #e0d8cd;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-decoration: none;
    }
    .area:hover, .area:focus-visible { border-color: #6a1b3d; }
    .area img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }
    .area img.area-recipe-image { object-position: center 32%; }
    .area-content { padding: 1.5rem; }
    .area h3 { margin: 0 0 0.5rem; color: #6a1b3d; font-size: 1.35rem; }
    .area p { margin: 0; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>maexx69.de</h1>
      <p>Willkommen!</p>
    </div>
  </header>
  <main>
    <h2>Wähle einen Bereich</h2>
    <nav class="areas" aria-label="Bereiche">
      <a class="area" href="news.html">
        <img src="assets/startseite-tdl-dolomiten.jpg" alt="">
        <div class="area-content">
          <h3>TDL</h3>
        </div>
      </a>
      <a class="area" href="rezepte/">
        <img class="area-recipe-image" src="assets/startseite-leckkerding-unscharf.jpg?v=3" alt="">
        <div class="area-content">
          <h3>Leckkerding</h3>
        </div>
      </a>
    </nav>
  </main>
</body>
</html>
